<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NYC Neighborhood Breakdown</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NYC Hoods">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Map_of_New_York_City.svg/1024px-Map_of_New_York_City.svg.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <style>
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .ripple {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .bar-fill {
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-start pt-12 px-6 text-slate-800 overflow-hidden">

    <div class="max-w-md w-full flex flex-col items-center text-center space-y-6">
        
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">What's this called?</h1>
            <p class="text-sm text-slate-500">A geometric simulation of neighborhood ambiguity.</p>
        </div>

        <button id="locate-btn" class="relative group w-24 h-24 mt-4 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-xl transition-transform active:scale-95 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>
        <p id="status-text" class="text-sm text-slate-400 font-medium h-4 mt-2">Ready</p>

        <!-- Results List -->
        <div id="results-container" class="w-full flex flex-col space-y-4 w-full mt-6 opacity-0 transition-opacity duration-500">
            <!-- Items injected by JS -->
        </div>

    </div>

    <script>
        let geojsonData = null;
        const btn = document.getElementById('locate-btn');
        const statusText = document.getElementById('status-text');
        const resultsContainer = document.getElementById('results-container');

        fetch('neighborhoods.json')
            .then(res => res.json())
            .then(data => {
                geojsonData = data;
                console.log("Loaded data");
            })
            .catch(err => {
                statusText.innerText = "Error loading data.";
                statusText.classList.add("text-red-500");
            });

        btn.addEventListener('click', () => {
            if (!geojsonData) return;
            if (!navigator.geolocation) return;

            btn.classList.add('ripple', 'bg-blue-500');
            statusText.innerText = "Locating...";
            resultsContainer.style.opacity = '0';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    findNeighborhood(position.coords.longitude, position.coords.latitude);
                },
                (error) => {
                    btn.classList.remove('ripple', 'bg-blue-500');
                    statusText.innerText = "Location access denied.";
                    statusText.classList.add("text-red-500");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });

        function findNeighborhood(lon, lat) {
            const pt = turf.point([lon, lat]);
            let distances = [];

            for (const feature of geojsonData.features) {
                if (feature.geometry.type === 'Polygon' || feature.geometry.type === 'MultiPolygon') {
                    const centroid = turf.centroid(feature);
                    const dist = turf.distance(pt, centroid, {units: 'kilometers'});
                    const isInside = turf.booleanPointInPolygon(pt, feature);
                    distances.push({ name: feature.properties.name, dist: dist, isInside: isInside });
                }
            }

            distances.sort((a, b) => a.dist - b.dist);
            const top4 = distances.slice(0, 4);

            let totalWeight = 0;
            for (const t of top4) {
                t.weight = 1 / Math.pow(t.dist, 4); // Steep dropoff for distance
                if (t.isInside) t.weight *= 3; // Boost if technically inside the polygon
                totalWeight += t.weight;
            }

            let resultsHTML = '';
            
            for (let i = 0; i < top4.length; i++) {
                const t = top4[i];
                const pct = Math.round((t.weight / totalWeight) * 100);
                if (pct > 0) {
                    const isTop = (i === 0);
                    const color = isTop ? 'bg-blue-600' : 'bg-slate-300';
                    const textColor = isTop ? 'text-slate-900 font-bold' : 'text-slate-600';
                    const size = isTop ? 'text-2xl' : 'text-lg';
                    
                    resultsHTML += `
                        <div class="flex flex-col text-left">
                            <div class="flex justify-between items-baseline mb-1">
                                <span class="${size} ${textColor} tracking-tight">${t.name}</span>
                                <span class="${size} ${textColor}">${pct}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2.5">
                                <div class="${color} h-2.5 rounded-full bar-fill" style="width: 0%" data-width="${pct}%"></div>
                            </div>
                        </div>
                    `;
                }
            }

            resultsContainer.innerHTML = resultsHTML;
            resultsContainer.style.opacity = '1';
            
            // Animate bars
            setTimeout(() => {
                const bars = document.querySelectorAll('.bar-fill');
                bars.forEach(bar => {
                    bar.style.width = bar.getAttribute('data-width');
                });
            }, 50);

            btn.classList.remove('ripple', 'bg-blue-500');
            statusText.innerText = "Found!";
        }
    </script>
</body>
</html>
