<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NYC Neighborhood Finder</title>
    
    <!-- PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NYC Hoods">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Map_of_New_York_City.svg/1024px-Map_of_New_York_City.svg.png">

    <!-- Tailwind for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Turf.js for spatial analysis -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <style>
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .ripple {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-6 text-slate-800 overflow-hidden">

    <div class="max-w-md w-full flex flex-col items-center text-center space-y-8">
        
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">Neighborhood Finder</h1>
            <p class="text-slate-500">Find exactly which NYC micro-neighborhood you're in.</p>
        </div>

        <!-- Result Display -->
        <div id="result-container" class="h-32 flex flex-col justify-center items-center w-full">
            <p id="status-text" class="text-lg text-slate-400 font-medium">Ready</p>
            <h2 id="neighborhood-name" class="text-4xl font-black text-blue-600 tracking-tight leading-tight hidden mt-2"></h2>
        </div>

        <!-- Action Button -->
        <button id="locate-btn" class="relative group w-32 h-32 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-xl transition-transform active:scale-95 focus:outline-none focus:ring-4 focus:ring-blue-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>

        <p class="text-xs text-slate-400 mt-8 max-w-xs">
            Based on highly detailed crowdsourced polygon data.
        </p>

    </div>

    <script>
        let geojsonData = null;
        const btn = document.getElementById('locate-btn');
        const statusText = document.getElementById('status-text');
        const hoodName = document.getElementById('neighborhood-name');

        // Load the GeoJSON on startup
        fetch('neighborhoods.json')
            .then(res => res.json())
            .then(data => {
                geojsonData = data;
                console.log("Loaded neighborhoods:", geojsonData.features.length);
            })
            .catch(err => {
                console.error("Error loading geojson:", err);
                statusText.innerText = "Error loading map data.";
                statusText.classList.add("text-red-500");
            });

        btn.addEventListener('click', () => {
            if (!geojsonData) {
                alert("Map data is still loading. Please try again in a second.");
                return;
            }

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            // UI feedback
            btn.classList.add('ripple', 'bg-blue-500');
            statusText.classList.remove('hidden');
            statusText.innerText = "Finding your exact location...";
            hoodName.classList.add('hidden');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    findNeighborhood(lon, lat);
                },
                (error) => {
                    console.error(error);
                    btn.classList.remove('ripple', 'bg-blue-500');
                    statusText.innerText = "Location access denied or failed.";
                    statusText.classList.add("text-red-500");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });

        function findNeighborhood(lon, lat) {
            const pt = turf.point([lon, lat]);
            let found = null;

            for (const feature of geojsonData.features) {
                // Turf pointInPolygon handles Polygon and MultiPolygon
                if (feature.geometry.type === 'Polygon' || feature.geometry.type === 'MultiPolygon') {
                    if (turf.booleanPointInPolygon(pt, feature)) {
                        found = feature.properties.name || feature.properties.neighborhood;
                        break;
                    }
                }
            }

            // UI Update
            btn.classList.remove('ripple', 'bg-blue-500');
            statusText.classList.add('hidden');
            
            if (found) {
                hoodName.innerText = found;
                hoodName.classList.remove('hidden');
            } else {
                statusText.innerText = "You don't seem to be in any known NYC neighborhood!";
                statusText.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
